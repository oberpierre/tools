---
- name: OpenVPN Deployment on Kubernetes
  hosts: init_controller

  vars:
    openvpn_namespace: openvpn
    openvpn_domain: vpn.example.com
    openvpn_clients:
      - client1
      - client2

  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        name: "{{ openvpn_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Configure UFW for OpenVPN
      block:
        - name: Check if UFW is installed
          ansible.builtin.command: which ufw
          register: ufw_check
          failed_when: false
          changed_when: false

        - name: Allow OpenVPN port through UFW
          community.general.ufw:
            rule: allow
            port: "31194"
            proto: udp
            comment: "OpenVPN NodePort"
          when: ufw_check.rc == 0
          become: true

        - name: Show UFW status
          ansible.builtin.command: ufw status
          register: ufw_status
          when: ufw_check.rc == 0
          become: true
          changed_when: false

        - name: Display UFW info
          ansible.builtin.debug:
            msg: |
              UFW Status: {{ ufw_status.stdout if ufw_check.rc == 0 else 'UFW not installed' }}
          when: ufw_check.rc == 0

    - name: Create OpenVPN PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: openvpn-pvc
            namespace: "{{ openvpn_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn
            resources:
              requests:
                storage: 1Gi

    - name: Create OpenVPN init job
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: openvpn-init
            namespace: "{{ openvpn_namespace }}"
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: openvpn-init
                    image: kylemanna/openvpn
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set -e
                        if [ ! -f /etc/openvpn/pki/ca.crt ]; then
                          echo "Initializing OpenVPN..."
                          ovpn_genconfig -u udp://{{ openvpn_domain }}:31194
                          echo "{{ openvpn_domain }}" | ovpn_initpki nopass
                          echo "Done!"
                        else
                          echo "Already initialized"
                        fi

                        # Generate client certificates
                        {% for client in openvpn_clients %}
                        if [ ! -f /etc/openvpn/pki/issued/{{ client }}.crt ]; then
                          echo "Creating client cert for {{ client }}..."
                          easyrsa build-client-full {{ client }} nopass
                        fi
                        {% endfor %}
                    volumeMounts:
                      - name: openvpn-data
                        mountPath: /etc/openvpn
                volumes:
                  - name: openvpn-data
                    persistentVolumeClaim:
                      claimName: openvpn-pvc

    - name: Wait for init job
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: openvpn-init
        namespace: "{{ openvpn_namespace }}"
        wait: true
        wait_condition:
          type: Complete
          status: "True"
        wait_timeout: 300

    - name: Create OpenVPN server
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openvpn-server
            namespace: "{{ openvpn_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: openvpn
            template:
              metadata:
                labels:
                  app: openvpn
              spec:
                containers:
                  - name: openvpn
                    image: kylemanna/openvpn
                    securityContext:
                      capabilities:
                        add: [NET_ADMIN]
                      privileged: true
                    ports:
                      - containerPort: 1194
                        protocol: UDP
                    command: [ovpn_run]
                    volumeMounts:
                      - name: openvpn-data
                        mountPath: /etc/openvpn
                      - name: dev-tun
                        mountPath: /dev/net/tun
                volumes:
                  - name: openvpn-data
                    persistentVolumeClaim:
                      claimName: openvpn-pvc
                  - name: dev-tun
                    hostPath:
                      path: /dev/net/tun

    - name: Create OpenVPN service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: openvpn-service
            namespace: "{{ openvpn_namespace }}"
          spec:
            type: NodePort
            selector:
              app: openvpn
            ports:
              - port: 1194
                targetPort: 1194
                nodePort: 31194
                protocol: UDP

    - name: Get client configs
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "get-{{ item }}-config"
            namespace: "{{ openvpn_namespace }}"
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: get-config
                    image: kylemanna/openvpn
                    command:
                      - /bin/bash
                      - -c
                      - |
                        ovpn_getclient {{ item }}
                    volumeMounts:
                      - name: openvpn-data
                        mountPath: /etc/openvpn
                volumes:
                  - name: openvpn-data
                    persistentVolumeClaim:
                      claimName: openvpn-pvc
      loop: "{{ openvpn_clients }}"

    - name: Show instructions
      ansible.builtin.debug:
        msg: |
          OpenVPN is running!

          Get your client configs:
          {% for client in openvpn_clients %}
          kubectl logs -n {{ openvpn_namespace }} job/get-{{ client }}-config > {{ client }}.ovpn
          {% endfor %}
