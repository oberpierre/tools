---
- name: Deploying Redis
  hosts: init_controller
  vars:
    redis_namespace: data-services
    redis_secret_name: redis-credentials
    redis_tailnet_hostname: redis
  vars_files:
    - vars/example_user_vault.yml

  roles:
    - helm

  tasks:
    - name: Creating namespace {{ redis_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ redis_namespace }}"

    - name: Creating Redis secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ redis_secret_name }}"
            namespace: "{{ redis_namespace }}"
          type: Opaque
          data:
            redis-password: "{{ vault_redis_password | b64encode }}"
      no_log: true

    - name: Installing/Upgrading Redis
      kubernetes.core.helm:
        name: redis
        chart_repo_url: https://charts.bitnami.com/bitnami
        chart_ref: redis
        chart_version: 28.0.2
        release_namespace: "{{ redis_namespace }}"
        state: present
        values:
          architecture: standalone

          # This key replaces the chart default rather than merging, so appendonly and save must stay here.
          # maxmemory sits well under the container limit, because an AOF rewrite forks and copy-on-write can outgrow the dataset.
          # noeviction makes a full Redis refuse writes rather than drop queued work or get OOM-killed.
          commonConfiguration: |-
            appendonly yes
            save ""
            aclfile /data/users.acl
            maxmemory 320mb
            maxmemory-policy noeviction

          auth:
            enabled: true
            existingSecret: "{{ redis_secret_name }}"
            existingSecretPasswordKey: redis-password

          master:
            # The aclfile must name `default` before Redis loads it, or ACLLoadFromFile
            # replaces the existing default user with a fresh nopass one and the
            # release's requirepass is discarded. Rewritten on every start, not only
            # when absent, so rotating vault_redis_password takes effect. Every other
            # line (application users registered later) is preserved.
            # runAsUser/runAsGroup match Redis's own (1001), stated rather than
            # inherited: podSecurityContext sets fsGroup but no runAsUser, so an
            # unowned file is one ACL SAVE away from failing to write.
            initContainers:
              - name: create-acl-file
                # Same image the chart's own volume-permissions init container uses.
                image: '{% raw %}{{ include "redis.volumePermissions.image" . }}{% endraw %}'
                securityContext:
                  runAsUser: 1001
                  runAsGroup: 1001
                env:
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ redis_secret_name }}"
                        key: redis-password
                command:
                  - /bin/sh
                  - -c
                  - |
                    touch /data/users.acl
                    HASH=$(printf '%s' "$REDIS_PASSWORD" | sha256sum | cut -d' ' -f1)
                    grep -v '^user default ' /data/users.acl > /data/users.acl.tmp
                    printf 'user default on #%s ~* &* +@all\n' "$HASH" >> /data/users.acl.tmp
                    mv /data/users.acl.tmp /data/users.acl
                volumeMounts:
                  - name: redis-data
                    mountPath: /data

            # Setting this replaces the chart's resourcesPreset, whose 192Mi limit the dataset outgrew.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi

            persistence:
              enabled: true
              size: 8Gi
              storageClass: longhorn

            service:
              type: ClusterIP
              annotations:
                tailscale.com/expose: "true"
                tailscale.com/hostname: "{{ redis_tailnet_hostname }}"

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            prometheusRule:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
              # Ansible's raw and Helm's backtick literal each pass Prometheus's {{ $labels }} through, because the chart runs rules through tpl.
              rules:
                - alert: RedisMemoryNearMax
                  expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8 and redis_memory_max_bytes > 0
                  for: 15m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Redis memory above 80% of maxmemory"
                    description: >-
                      {% raw %}{{`{{ $labels.instance }} is at {{ $value | humanizePercentage }} of maxmemory.
                      Check queue lengths with LLEN.`}}{% endraw %}
                - alert: RedisRestarting
                  expr: increase(kube_pod_container_status_restarts_total{namespace="{{ redis_namespace }}", container="redis"}[30m]) > 2
                  labels:
                    severity: critical
                  annotations:
                    summary: "Redis is restarting repeatedly"
                    description: "{% raw %}{{`{{ $labels.pod }} restarted {{ $value }} times in 30m. Check for OOMKilled.`}}{% endraw %}"
