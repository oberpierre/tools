---
- name: Deploying Redis
  hosts: init_controller
  vars:
    redis_namespace: data-services
    redis_secret_name: redis-credentials
  vars_files:
    - vars/example_user_vault.yml

  roles:
    - helm

  tasks:
    - name: Creating namespace {{ redis_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ redis_namespace }}"

    - name: Creating Redis secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ redis_secret_name }}"
            namespace: "{{ redis_namespace }}"
          type: Opaque
          data:
            redis-password: "{{ vault_redis_password | b64encode }}"
      no_log: true

    - name: Installing/Upgrading Redis
      kubernetes.core.helm:
        name: redis
        chart_repo_url: https://charts.bitnami.com/bitnami
        chart_ref: redis
        release_namespace: "{{ redis_namespace }}"
        state: present
        values:
          architecture: standalone

          # aclfile added to the chart's own appendonly/save defaults: setting this key
          # replaces rather than merges with the chart default, so both must stay here.
          commonConfiguration: |-
            appendonly yes
            save ""
            aclfile /data/users.acl

          auth:
            enabled: true
            existingSecret: "{{ redis_secret_name }}"
            existingSecretPasswordKey: redis-password

          master:
            # The aclfile must exist before Redis starts, or ACL SAVE has nothing to
            # write to. Idempotent: touch never truncates a file that already exists.
            # runAsUser/runAsGroup match Redis's own (1001), stated rather than
            # inherited: podSecurityContext sets fsGroup but no runAsUser, so an
            # unowned file is one ACL SAVE away from failing to write.
            initContainers:
              - name: create-acl-file
                # Same image the chart's own volume-permissions init container uses.
                image: '{% raw %}{{ include "redis.volumePermissions.image" . }}{% endraw %}'
                securityContext:
                  runAsUser: 1001
                  runAsGroup: 1001
                command:
                  - /bin/bash
                  - -c
                  - touch /data/users.acl
                volumeMounts:
                  - name: redis-data
                    mountPath: /data

            persistence:
              enabled: true
              size: 8Gi
              storageClass: longhorn

            service:
              type: ClusterIP

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
