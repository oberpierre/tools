---
- name: Deploy kube-prometheus-stack with preconfigured dashboards
  hosts: init_controller
  vars:
    prometheus_namespace: monitoring
    cluster_issuer: letsencrypt-prod
    grafana_hosts:
      - dashboard.example.com
    grafana_service_name: kube-prometheus-stack-grafana
    grafana_service_port: 80
    grafana_admin_secret: grafana-admin
  vars_files:
    - vars/example_user_vault.yml

  roles:
    - helm

  tasks:
    - name: Creating .kube folder
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube/monitoring"
        state: directory
        mode: "0755"
      register: dest_folder

    - name: Creating namespace {{ prometheus_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ prometheus_namespace }}"

    - name: Creating the Grafana admin secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ grafana_admin_secret }}"
            namespace: "{{ prometheus_namespace }}"
          type: Opaque
          stringData:
            admin-user: "{{ vault_grafana_user }}"
            admin-password: "{{ vault_grafana_password }}"
      no_log: true

    - name: Creating kube-prometheus-stack values file
      ansible.builtin.copy:
        dest: "{{ dest_folder.path }}/prometheus-values.yml"
        mode: "0600"
        content: |
          grafana:
            admin:
              existingSecret: "{{ grafana_admin_secret }}"
              userKey: admin-user
              passwordKey: admin-password
            grafana.ini:
              auth.anonymous:
                enabled: false
            ingress:
              enabled: false
            dashboards:
              default:
                node-exporter-full:
                  gnetId: 1860
                  revision: 41
                  datasource: Prometheus
                k8s-dashboard:
                  gnetId: 15661
                  revision: 2
                  datasource: Prometheus
          prometheus:
            prometheusSpec:
              serviceMonitorSelectorNilUsesHelmValues: false
          # Alertmanager: route the backup alerts (BackupVerifyFailed/Stale, BackupStale,
          # *MetricsMissing) to Telegram; everything else, including the always-on Watchdog
          # heartbeat, falls through to the null sink.
          alertmanager:
            config:
              route:
                receiver: "null"
                group_by: [alertname, store]
                routes:
                  - receiver: telegram
                    matchers:
                      - 'alertname=~"Backup.*"'
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 4h
              receivers:
                - name: "null"
                - name: telegram
                  telegram_configs:
                    - bot_token: "{{ vault_telegram_bot_token }}"
                      chat_id: {{ vault_telegram_chat_id }}
                      send_resolved: true
      register: prometheus_values
      no_log: true

    - name: Deploying kube-prometheus-stack
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_ref: kube-prometheus-stack
        release_namespace: "{{ prometheus_namespace }}"
        create_namespace: true
        state: present
        values_files:
          - "{{ prometheus_values.dest }}"
      no_log: true # Values file contains secrets

    - name: Waiting for Grafana service to be available
      kubernetes.core.k8s_info:
        kind: Service
        # Default service name for Grafana in kube-prometheus-stack is '{{ release_name }}-grafana'
        name: "{{ grafana_service_name }}"
        namespace: "{{ prometheus_namespace }}"
      register: grafana_svc_info
      until: grafana_svc_info.resources | length > 0
      retries: 10
      delay: 15

    - name: Deploying grafana ingress
      ansible.builtin.template:
        lstrip_blocks: true
        src: templates/ingress_deployment.j2
        dest: "{{ dest_folder.path }}/ingress.yml"
        mode: "0600"
      vars:
        cluster_issuer_name: "{{ cluster_issuer }}"
        app_name: grafana
        create_deployment: false
        create_service: false
        external_service_name: "{{ grafana_service_name }}"
        external_service_port: "{{ grafana_service_port }}"
        metadata_namespace: "{{ prometheus_namespace }}"
        tls_hosts: "{{ grafana_hosts }}"
      register: ingress

    - name: Applying Grafana ingress
      kubernetes.core.k8s:
        state: present
        src: "{{ ingress.dest }}"
