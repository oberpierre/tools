---
- name: Deploying Prometheus Pushgateway
  hosts: init_controller
  vars:
    pushgateway_namespace: monitoring

  roles:
    - helm

  tasks:
    - name: Deploying Prometheus Pushgateway
      kubernetes.core.helm:
        name: pushgateway
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_ref: prometheus-pushgateway
        release_namespace: "{{ pushgateway_namespace }}"
        create_namespace: true
        state: present
        values:
          # Fixed name so the push URL is stable (pushgateway.monitoring.svc, not a release-prefixed one).
          fullnameOverride: pushgateway
          serviceMonitor:
            enabled: true
          # Persisted to a small volume for series to be persistent across restarts, including last-success
          # timestamps on which we may alert (staleness / dead-man's-switch)
          persistentVolume:
            enabled: true
            size: 1Gi
            storageClass: longhorn
