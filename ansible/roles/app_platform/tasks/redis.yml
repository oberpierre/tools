---
# Central Redis admin credentials (the `default` user), read from the cluster rather
# than passed in, mirroring postgres.yml.
- name: Reading Redis admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: redis-credentials
    namespace: data-services
  register: app_platform_redis_admin_secret

- name: Decoding Redis admin password
  ansible.builtin.set_fact:
    app_platform_redis_admin_password: >-
      {{ app_platform_redis_admin_secret.resources[0].data['redis-password'] | b64decode }}
  no_log: true

- name: Registering Redis ACL user
  kubernetes.core.k8s_exec:
    namespace: data-services
    pod: redis-master-0
    container: redis # target the DB container explicitly, not the metrics sidecar
    # reset clears whatever a previous deploy left before the declared rules are
    # (re)applied, so a narrowed or renamed ACL string fully replaces the old one
    # instead of merging with it. The ACL string itself is only ever item.acl: this
    # role never assumes a scope or writes one of its own.
    command: >-
      redis-cli -a {{ app_platform_redis_admin_password | quote }} --no-auth-warning
      ACL SETUSER {{ item.name | quote }} reset on >{{ item.password | quote }} {{ item.acl }}
  loop: "{{ redis_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: app_platform_redis_acl_result
  # rc defaults to a nonzero sentinel: k8s_exec calls fail_json, leaving no rc at all,
  # when the exec stream itself cannot open, and this expression must not raise
  # before the failure task below gets a chance to report why.
  # ACL SETUSER has exactly one success reply, OK, whether or not the user's rules
  # actually differed from what was already registered, so this reports changed on
  # every successful run. Real change detection needs a state comparison against
  # ACL GETUSER, which this task does not implement.
  changed_when:
    - (app_platform_redis_acl_result.rc | default(1)) == 0
    - (app_platform_redis_acl_result.stdout | default('') | trim) == 'OK'
  # redis-cli exits 0 even when the server rejects the command, so rc alone never
  # catches a bad ACL string or a rotated admin password. The real check is the next
  # task, kept separate so this one can stay no_log (it carries the admin password)
  # without also hiding why it failed.
  failed_when: false
  no_log: true

# Runs immediately after the loop above and before either failure gate, so a var file
# whose second user is malformed still gets the first, already-registered user saved
# to disk rather than left live in memory only and lost on the next restart.
- name: Persisting Redis ACL users
  kubernetes.core.k8s_exec:
    namespace: data-services
    pod: redis-master-0
    container: redis
    command: >-
      redis-cli -a {{ app_platform_redis_admin_password | quote }} --no-auth-warning ACL SAVE
  register: app_platform_redis_save_result
  # ACL SAVE has exactly one success reply, OK, whether or not the on-disk ACL file
  # actually changed, so this reports changed on every successful run. Real change
  # detection needs a state comparison against the persisted ACL file, which this
  # task does not implement.
  changed_when:
    - (app_platform_redis_save_result.rc | default(1)) == 0
    - (app_platform_redis_save_result.stdout | default('') | trim) == 'OK'
  # Same stdout-based check as above: the failure this guards against is a registered
  # user that works until the next restart and then silently stops authenticating.
  failed_when: false
  no_log: true

- name: Failing on a Redis ACL registration that did not apply cleanly
  ansible.builtin.fail:
    msg: >-
      Redis ACL registration failed for user {{ redis_users[item].name }}
      (transport rc={{ app_platform_redis_acl_result.results[item].rc | default('n/a') }}):
      {{ app_platform_redis_acl_result.results[item].stdout |
      default(app_platform_redis_acl_result.results[item].msg) | default('no output', true) }}
  # The loop variable is an index, not the per-iteration result: that result's own
  # item key is the redis_users entry, password included, and looping it directly
  # would put that entry back into a value ansible dumps on a failed item.
  # This message prints stdout unredacted, unlike the Postgres password task: the
  # command above carries the credential as an ACL SETUSER argument, but redis-cli's
  # reply never echoes its own argv, and k8s_exec's only fail_json here is "Failed to
  # execute on pod %s due to : %s", whose exception comes from websocket_call and
  # carries no request URL, which is where the command would live. There is no
  # failure path in Redis's ACL SETUSER that reflects the command line back, so
  # there is nothing here for a redaction to catch.
  loop: "{{ range(app_platform_redis_acl_result.results | length) | list }}"
  loop_control:
    label: "{{ redis_users[item].name }}"
  # An allowlist, not a blocklist: redis-cli splits its output across both streams, so
  # an error string picked up from stdout alone can miss a failure that only shows on
  # stderr, and a list of tokens is only ever as complete as what someone already
  # thought to name. ACL SETUSER has exactly one success reply, so anything that is
  # not that reply fails, whatever it says and on whichever stream it says it. rc
  # defaults to a nonzero sentinel for the same reason as the task above: a fail_json
  # result carries neither rc nor stdout, and this must not raise on its way to
  # reporting that.
  when: >-
    (app_platform_redis_acl_result.results[item].rc | default(1)) != 0 or
    (app_platform_redis_acl_result.results[item].stdout | default('') | trim) != 'OK'

- name: Failing if Redis ACL persistence did not apply cleanly
  ansible.builtin.fail:
    msg: >-
      Redis ACL SAVE failed (transport rc={{ app_platform_redis_save_result.rc | default('n/a') }}):
      {{ app_platform_redis_save_result.stdout | default(app_platform_redis_save_result.msg) | default('no output') }}
  # Same allowlist as the registration check above, with the same rc default.
  when: >-
    (app_platform_redis_save_result.rc | default(1)) != 0 or
    (app_platform_redis_save_result.stdout | default('') | trim) != 'OK'
