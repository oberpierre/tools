---
# env is a generic passthrough for plain configuration, so nothing here inspects
# a key's meaning, only its shape, its type and whether env_from already supplies it.
- name: Rejecting a workload env that is not a mapping
  ansible.builtin.assert:
    that:
      - workloads[item].env is mapping
    fail_msg: >-
      workloads entry {{ workloads[item].name | default('(unnamed)') }} declares
      env that is not a mapping. Supply a mapping of environment variable name to
      string value.
    quiet: true
  loop: "{{ range(workloads | default([]) | length) | list }}"
  loop_control:
    label: "{{ workloads[item].name | default('(unnamed)') }}"
  when: workloads[item].env is defined

# Flattened once so the per-key checks below loop (workload, key) pairs directly:
# an assert task takes one loop, not one per workload times one per key.
- name: Flattening workload env into (workload, key) pairs
  ansible.builtin.set_fact:
    app_platform_env_pairs: >-
      {{ app_platform_env_pairs | default([]) +
         (workloads[item].env
          | dict2items
          | map('combine', {'workload': workloads[item].name})
          | list) }}
  loop: "{{ range(workloads | default([]) | length) | list }}"
  loop_control:
    label: "{{ workloads[item].name | default('(unnamed)') }}"
  when: workloads[item].env is defined

# Placed ahead of the syntax check below: item.key.split('/') there raises an
# unhandled AnsibleUndefinedVariable on a non-string key instead of this file's
# own fail_msg, so a non-string key must be caught by name first.
- name: Rejecting a workload env key that is not a string
  ansible.builtin.assert:
    that:
      - item.key is string
    fail_msg: >-
      workload {{ item.workload }} declares env key "{{ item.key }}" that is not
      a string. Environment variable names must be strings. Quote the key in the
      var file.
    quiet: true
  loop: "{{ app_platform_env_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

- name: Rejecting a workload env key that fails the syntax check
  ansible.builtin.assert:
    that:
      - item.key is match('^[-._A-Za-z][-._A-Za-z0-9]*\Z')
    fail_msg: >-
      workload {{ item.workload }} declares env key "{{ item.key }}" that fails
      the syntax check: a name must start with a letter, underscore, period or
      hyphen, and contain only letters, digits, underscores, periods and hyphens
      thereafter.
    quiet: true
  loop: "{{ app_platform_env_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

# env values reach the Pod spec as literal strings, so an unquoted true, no or a
# bare number is a YAML scalar of the wrong type and the API rejects the whole Pod
# spec. Rejected rather than coerced, for the same reason as the ingress check.
- name: Rejecting a workload env value that is not a string
  ansible.builtin.assert:
    that:
      - item.value is string
    fail_msg: >-
      workload {{ item.workload }} declares env key "{{ item.key }}" with a value
      that is not a string. Environment variable values must be strings. Quote
      the value in the var file.
    quiet: true
  loop: "{{ app_platform_env_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

# Only an env_from entry naming a Secret app_secrets actually declares is
# considered: one naming an undeclared Secret is a separate, uncaught gap.
- name: Flattening each workload's env_from-supplied variable names into (workload, key, secret) triples
  ansible.builtin.set_fact:
    app_platform_env_from_pairs: >-
      {{ app_platform_env_from_pairs | default([]) +
         (app_secrets[item.1]
          | dict2items
          | map('combine', {'workload': item.0.name, 'secret': item.1})
          | list) }}
  loop: "{{ workloads | subelements('env_from', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  when: item.1 in (app_secrets | default({}))

# Kubernetes lets env silently win over envFrom whatever order the two blocks
# appear in, so a name declared in both is rejected rather than resolved for
# the author.
- name: Rejecting a workload env key already supplied by one of its env_from Secrets
  ansible.builtin.assert:
    that:
      - app_platform_env_from_collision == []
    fail_msg: >-
      workload {{ item.workload }} declares env key "{{ item.key }}" that is
      already supplied by its env_from Secret
      {{ app_platform_env_from_collision | map(attribute='secret') | join(', ') }}.
      Each variable name may come from only one of env or env_from.
    quiet: true
  vars:
    app_platform_env_from_collision: >-
      {{ app_platform_env_from_pairs
         | default([])
         | selectattr('workload', 'equalto', item.workload)
         | selectattr('key', 'equalto', item.key)
         | list }}
  loop: "{{ app_platform_env_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"
