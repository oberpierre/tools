---
# Registering against a shared datastore's own administrative identity, or with no
# password at all, does not fail on either side: Redis and Postgres both accept it
# and the caller's declared entry goes live anyway. Both mistakes are asserted here,
# naming the offending entry, before anything is registered.

# The loop is over the index, not the list itself: indexing resolves each entry's
# fields one at a time, so a key an overlay never supplied only breaks that entry's
# own lookup instead of raising eagerly for the whole list before any assert here
# gets to name which entry was wrong.

# A missing name makes the reserved-name check below raise deep inside a dict
# lookup rather than naming the entry, whereas a blank name passes that check
# silently and only fails once Redis rejects it. Both are caught here first.
- name: Rejecting a Redis user entry with no usable name
  ansible.builtin.assert:
    that:
      - redis_users[item].name is defined
      - (redis_users[item].name | trim) != ''
    fail_msg: >-
      redis_users[{{ item }}] has no name, or its name is blank after trimming.
      Every redis_users entry must declare a non-blank name.
    quiet: true
  loop: "{{ range(redis_users | default([]) | length) | list }}"
  loop_control:
    label: "{{ redis_users[item].name | default('(unnamed)') }}"

- name: Rejecting a Redis user named default
  ansible.builtin.assert:
    that:
      - redis_users[item].name != 'default'
    fail_msg: >-
      redis_users declares a user named "default" which is reserved for Redis's
      administrative identity. Apps may not declare a user with this name.
      Rename this entry.
    quiet: true
  loop: "{{ range(redis_users | default([]) | length) | list }}"
  loop_control:
    label: "{{ redis_users[item].name | default('(unnamed)') }}"

- name: Rejecting an empty or whitespace-only Redis user password
  ansible.builtin.assert:
    that:
      # default('', true) also substitutes for an explicit null, which default('')
      # alone would pass through as the literal string "None".
      - (redis_users[item].password | default('', true) | trim) != ''
    fail_msg: >-
      redis_users entry {{ redis_users[item].name | default('(unnamed)') }} declares
      an empty or whitespace-only password, which would result in a no-password
      Redis user. Apps must supply a real password. Provide a password or fix
      whatever environment variable was meant to hold it.
    quiet: true
  loop: "{{ range(redis_users | default([]) | length) | list }}"
  loop_control:
    label: "{{ redis_users[item].name | default('(unnamed)') }}"

# Same defect as the Redis check above: a missing user raises inside the
# reserved-name check below, and a blank one passes it silently and only fails once
# Postgres rejects it.
- name: Rejecting a Postgres database entry with no usable user
  ansible.builtin.assert:
    that:
      - postgres_databases[item].user is defined
      - (postgres_databases[item].user | trim) != ''
    fail_msg: >-
      postgres_databases[{{ item }}] has no user, or its user is blank after
      trimming. Every postgres_databases entry must declare a non-blank user.
    quiet: true
  loop: "{{ range(postgres_databases | default([]) | length) | list }}"
  loop_control:
    label: "{{ postgres_databases[item].user | default('(unnamed)') }}"

- name: Rejecting a Postgres role named postgres
  ansible.builtin.assert:
    that:
      - postgres_databases[item].user != 'postgres'
    fail_msg: >-
      postgres_databases declares a role named "postgres", which is reserved for the Postgres
      administrative identity. Apps must not declare a role with this name. Rename this entry.
    quiet: true
  loop: "{{ range(postgres_databases | default([]) | length) | list }}"
  loop_control:
    label: "{{ postgres_databases[item].user | default('(unnamed)') }}"

- name: Rejecting an empty or whitespace-only Postgres role password
  ansible.builtin.assert:
    that:
      - (postgres_databases[item].password | default('', true) | trim) != ''
    fail_msg: >-
      postgres_databases entry {{ postgres_databases[item].user | default('(unnamed)') }} declares an
      empty or whitespace-only password. Apps must supply a real password. Provide
      a password or fix whatever environment variable was meant to hold it.
    quiet: true
  loop: "{{ range(postgres_databases | default([]) | length) | list }}"
  loop_control:
    label: "{{ postgres_databases[item].user | default('(unnamed)') }}"

# ingress.annotations is a generic passthrough (any key becomes a literal Ingress
# annotation), so nothing here inspects a key's meaning, only its shape and identity.
- name: Rejecting a workload ingress.annotations that is not a mapping
  ansible.builtin.assert:
    that:
      - workloads[item].ingress.annotations is mapping
    fail_msg: >-
      workloads entry {{ workloads[item].name | default('(unnamed)') }} declares
      ingress.annotations that is not a mapping. Supply a mapping of annotation
      key to string value.
    quiet: true
  loop: "{{ range(workloads | default([]) | length) | list }}"
  loop_control:
    label: "{{ workloads[item].name | default('(unnamed)') }}"
  when: workloads[item].ingress is defined and workloads[item].ingress.annotations is defined

# Flattened once so the per-key checks below loop (workload, key) pairs
# directly: an assert task takes one loop, not one per workload times one per key.
- name: Flattening workload ingress.annotations into (workload, key) pairs
  ansible.builtin.set_fact:
    app_platform_annotation_pairs: >-
      {{ app_platform_annotation_pairs | default([]) +
         (workloads[item].ingress.annotations
          | dict2items
          | map('combine', {'workload': workloads[item].name})
          | list) }}
  loop: "{{ range(workloads | default([]) | length) | list }}"
  loop_control:
    label: "{{ workloads[item].name | default('(unnamed)') }}"
  when: workloads[item].ingress is defined and workloads[item].ingress.annotations is defined

# Placed ahead of the syntax check below: item.key.split('/') there raises an
# unhandled AnsibleUndefinedVariable on a non-string key instead of this file's
# own fail_msg, so a non-string key must be caught by name first.
- name: Rejecting a workload ingress.annotations key that is not a string
  ansible.builtin.assert:
    that:
      - item.key is string
    fail_msg: >-
      workload {{ item.workload }} declares ingress.annotations key
      "{{ item.key }}" that is not a string. Annotation keys must be strings.
      Quote the key in the var file.
    quiet: true
  loop: "{{ app_platform_annotation_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

- name: Rejecting a workload ingress.annotations key that fails the syntax check
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z0-9._/-]+\Z')
      - (item.key.split('/') | last | length) <= 63
      - item.key.split('/') | length <= 2
      - item.key.split('/') | map('length') | min >= 1
    fail_msg: >-
      workload {{ item.workload }} declares ingress.annotations key
      "{{ item.key }}" that fails the syntax check: a key must be non-empty,
      contain no whitespace, use only [A-Za-z0-9._/-], contain at most one /,
      have every segment non-empty, and have its segment after the last /
      63 characters or fewer.
    quiet: true
  loop: "{{ app_platform_annotation_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

# Annotations are map[string]string, so an unquoted true/false/no/yes or a bare
# number parses as a YAML scalar of the wrong type. The check rejects instead
# of stringifying it, because coercing would apply a value the author never wrote.
- name: Rejecting a workload ingress.annotations value that is not a string
  ansible.builtin.assert:
    that:
      - item.value is string
    fail_msg: >-
      workload {{ item.workload }} declares ingress.annotations key
      "{{ item.key }}" with a value that is not a string. Annotation values
      must be strings. Quote the value in the var file.
    quiet: true
  loop: "{{ app_platform_annotation_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

# One shared ingress-nginx controller serves every Ingress on this cluster, so a
# snippet annotation slipped into one app's var file is not scoped to that app alone.
- name: Rejecting a workload ingress.annotations key that is reserved
  ansible.builtin.assert:
    that:
      - item.key not in app_platform_reserved_ingress_annotations
    fail_msg: >-
      workload {{ item.workload }} declares ingress.annotations key
      "{{ item.key }}" which is reserved: it is either load-bearing for TLS,
      injects raw nginx/Lua configuration, or disagrees with the
      ingressClassName this template already sets. Remove it from
      ingress.annotations.
    quiet: true
  vars:
    app_platform_reserved_ingress_annotations:
      - cert-manager.io/cluster-issuer
      - nginx.ingress.kubernetes.io/ssl-redirect
      - nginx.ingress.kubernetes.io/configuration-snippet
      - nginx.ingress.kubernetes.io/server-snippet
      - nginx.ingress.kubernetes.io/auth-snippet
      - kubernetes.io/ingress.class
  loop: "{{ app_platform_annotation_pairs | default([]) }}"
  loop_control:
    label: "{{ item.workload }}/{{ item.key }}"

# app_secrets | default({}) | length > 0 in tasks/main.yml also passes for a string,
# since "oops" | length > 0 is True, so the shape has to be checked before anything
# treats app_secrets as a mapping.
- name: Rejecting an app_secrets that is not a mapping
  ansible.builtin.assert:
    that:
      - app_secrets is mapping
    fail_msg: >-
      app_secrets must map Secret names to mappings of environment variables. The
      declared value is not a mapping.
    quiet: true
  when: app_secrets is defined

# stringData needs a mapping of key to value, so a string, a list or a null passed
# as an entry's value would otherwise reach k8s_deploy_workloads.yml's k8s module
# and fail there with a Kubernetes API error naming a field, not the var file entry
# that caused it.

# Looping the keys, not the values, keeps a mismatched entry's own value out of the
# loop variable, so no no_log is needed on this assert.
- name: Rejecting an app_secrets value that is not a mapping
  ansible.builtin.assert:
    that:
      - app_secrets[item] is mapping
    fail_msg: >-
      app_secrets.{{ item }} is not a mapping. Each app_secrets entry must map
      environment variable names to values, the shape this Secret's stringData needs.
    quiet: true
  loop: "{{ app_secrets.keys() | list }}"
  loop_control:
    label: "{{ item }}"
  when: app_secrets is defined
