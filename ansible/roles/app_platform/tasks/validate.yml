---
# Registering against a shared datastore's own administrative identity, or with no
# password at all, does not fail on either side: Redis and Postgres both accept it
# and the caller's declared entry goes live anyway. Both mistakes are asserted here,
# naming the offending entry, before anything is registered.
- name: Validating the declared Redis users
  ansible.builtin.include_tasks: validate_redis.yml

- name: Validating the declared Postgres databases
  ansible.builtin.include_tasks: validate_postgres.yml

- name: Validating the declared workload ingress annotations
  ansible.builtin.include_tasks: validate_ingress.yml

- name: Validating the declared application Secrets
  ansible.builtin.include_tasks: validate_secrets.yml
