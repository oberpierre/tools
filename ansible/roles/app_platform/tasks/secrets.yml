---
# Writes exactly what app_secrets declares, key for key, as Secrets in the app
# namespace. The names and values are the calling repository's, so this role adds
# nothing to them.

# stringData needs a mapping of key to value; a string, a list or a null passed as
# an entry's value would otherwise reach k8s_deploy_workloads.yml's k8s module and
# fail there with a Kubernetes API error naming a field, not the var file entry that
# caused it.
#
# Looping app_secrets | dict2items templates every nested value eagerly, including a
# key an overlay never supplied, so the loop itself raises AnsibleUndefinedVariable
# naming only that key, before this assert gets a chance to name the entry. Looping
# the keys instead leaves each entry's value untemplated until it is indexed by name,
# so app_secrets[item] resolves one entry at a time (mirroring validate.yml), and the
# mistake this assert exists to catch, a string where a mapping belongs, never puts
# that string into the loop variable, so no no_log is needed here.
- name: Rejecting an app_secrets value that is not a mapping
  ansible.builtin.assert:
    that:
      - app_secrets[item] is mapping
    fail_msg: >-
      app_secrets.{{ item }} is not a mapping. Each app_secrets entry must map
      environment variable names to values, the shape this Secret's stringData needs.
    quiet: true
  loop: "{{ app_secrets.keys() | list }}"
  loop_control:
    label: "{{ item }}"

- name: Writing application Secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item }}"
        namespace: "{{ app_namespace }}"
      type: Opaque
      stringData: "{{ app_secrets[item] }}"
  loop: "{{ app_secrets.keys() | list }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
