---
# Writes exactly what app_secrets declares, key for key, as Secrets in the app
# namespace. The names and values are the calling repository's, so this role adds
# nothing to them. validate.yml has already rejected a non-mapping app_secrets and
# a non-mapping entry, so stringData below always receives the shape it needs.

- name: Writing application Secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item }}"
        namespace: "{{ app_namespace }}"
      type: Opaque
      stringData: "{{ app_secrets[item] }}"
  loop: "{{ app_secrets.keys() | list }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
