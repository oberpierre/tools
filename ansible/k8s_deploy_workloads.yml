---
- name: Deploying application workloads to Kubernetes
  hosts: all

  # Runs before roles:, so a malformed var file is rejected before app_platform's
  # registrations (Postgres role/password, Redis ACL) have any side effect on the
  # cluster: the deploy refuses the file outright rather than half-honouring it.
  pre_tasks:
    - name: Rejecting a var file that declares no workloads
      ansible.builtin.assert:
        that:
          - workloads is defined
          - workloads | length > 0
        fail_msg: >-
          No workloads declared. This playbook deploys the workloads a var file
          names, so add at least one entry to workloads before running it.
        quiet: true

    - name: Rejecting a workload with an unrecognised kind
      ansible.builtin.assert:
        that:
          - (item.kind | default('')) in ['Deployment', 'CronJob']
        fail_msg: >-
          workloads entry {{ item.name | default('(unnamed)') }} declares kind
          {{ item.kind | default('(unset)') }}, which this platform does not render.
          Declare kind as Deployment or CronJob.
        quiet: true
      loop: "{{ workloads }}"
      loop_control:
        label: "{{ item.name | default('(unnamed)') }}"

    - name: Rejecting a CronJob that declares service or ingress
      ansible.builtin.assert:
        that:
          - not ((item.kind | default('')) == 'CronJob' and (item.service is defined or item.ingress is defined))
        fail_msg: >-
          workloads entry {{ item.name | default('(unnamed)') }} is a CronJob
          declaring service or ingress. A scheduled job has no continuously running
          pod for a Service to select; drop service and ingress from this entry.
        quiet: true
      loop: "{{ workloads }}"
      loop_control:
        label: "{{ item.name | default('(unnamed)') }}"

    - name: Rejecting a workload that declares ingress without service
      ansible.builtin.assert:
        that:
          - not (item.ingress is defined and item.service is not defined)
        fail_msg: >-
          workloads entry {{ item.name | default('(unnamed)') }} declares ingress
          without service. An Ingress needs a backend Service and port to attach to,
          so declare service (with the port to expose) alongside ingress, or drop
          ingress if this workload should not be reachable from outside the cluster.
        quiet: true
      loop: "{{ workloads }}"
      loop_control:
        label: "{{ item.name | default('(unnamed)') }}"

    # registry[item] is defined is false both when the key is absent from the block
    # and when it is present but its value is an overlay variable the caller never
    # supplied, so this catches a partial block regardless of which way it is partial.
    - name: Rejecting a registry block missing a required key
      ansible.builtin.assert:
        that:
          - registry[item] is defined
        fail_msg: >-
          registry.{{ item }} does not resolve. registry.host, registry.username and
          registry.password are required together; omit registry entirely to deploy
          public images rather than leaving it partially filled in.
        quiet: true
      when: registry is defined
      loop: ["host", "username", "password"]
      loop_control:
        label: "{{ item }}"

    # Runs before roles: for the same reason as the checks above: workloads is read
    # only when the manifest template renders, after roles: has already rotated the
    # Postgres password and ACL SAVEd the Redis users, so an image the overlay forgot
    # would otherwise surface as a half-honoured var file instead of a clean refusal.
    - name: Rejecting a workload whose image the overlay did not supply
      ansible.builtin.assert:
        that:
          - item.image is defined
        fail_msg: >-
          workloads entry {{ item.name | default('(unnamed)') }} references an image
          that does not resolve. Supply its value through ansible_extra_vars before
          running this playbook.
        quiet: true
      loop: "{{ workloads }}"
      loop_control:
        label: "{{ item.name | default('(unnamed)') }}"

  roles:
    # Registers the namespace, Postgres and Redis credentials, and app Secrets the
    # workloads below assume already exist before their envFrom can resolve.
    - app_platform

  tasks:
    # Mirrors k8s_deploy_app.yml's registry auth secret. Without it, an application
    # whose images are private goes ImagePullBackOff on every workload below while the
    # apply itself still succeeds.
    - name: Create dockerconfigjson content for registry authentication
      ansible.builtin.set_fact:
        reg_auth_string: "{{ (registry.username + ':' + registry.password) | b64encode }}"
      when: registry is defined and registry.host is defined and registry.username is defined and registry.password is defined
      no_log: true

    - name: Build registry auth structure
      ansible.builtin.set_fact:
        reg_auth:
          auths: "{{ {registry.host: {'auth': reg_auth_string}} }}"
      when: reg_auth_string is defined
      no_log: true

    - name: Create container registry secret for authentication
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app_name }}-regcred"
            namespace: "{{ app_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ reg_auth | to_json | b64encode }}"
      when: reg_auth is defined
      no_log: true

    - name: Create app directory for manifests
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube/{{ app_name }}"
        state: directory
        mode: "0755"
      register: app_dir

    - name: Create workloads manifest
      ansible.builtin.template:
        lstrip_blocks: true
        src: templates/workloads.j2
        dest: "{{ app_dir.path }}/{{ app_name }}-workloads.yml"
        mode: "0600"
      register: workloads_manifest

    - name: Deploy application workloads {{ app_name }}
      kubernetes.core.k8s:
        state: present
        src: "{{ workloads_manifest.dest }}"

    # No failed_when here: a wait that cannot succeed fails the task on its own. This is
    # a health check, not a race against a credential's lifetime: readyReplicas counts
    # the outgoing revision's pods too, and at replicas: 1 the default 25% maxUnavailable
    # floors to 0, so the old condition was already satisfied by the previous rollout the
    # instant apply returned. Waiting on the generation, updated count and unavailable
    # count instead means an image that cannot be pulled or started fails the pipeline.
    # A CronJob gets no wait: creating one creates no pod, so nothing here would prove
    # its image can be pulled any earlier than the first scheduled run does.
    - name: Waiting for Deployments to reach declared replicas
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item.name }}"
        namespace: "{{ app_namespace }}"
      register: workload_deployment_status
      until:
        - workload_deployment_status.resources | length > 0
        - workload_deployment_status.resources[0].status.observedGeneration | default(-1) >= workload_deployment_status.resources[0].metadata.generation
        - workload_deployment_status.resources[0].status.updatedReplicas | default(0) == workload_deployment_status.resources[0].spec.replicas
        - workload_deployment_status.resources[0].status.unavailableReplicas | default(0) == 0
      retries: 10
      delay: 15
      loop: "{{ workloads | selectattr('kind', 'equalto', 'Deployment') | list }}"
      loop_control:
        label: "{{ item.name }}"
