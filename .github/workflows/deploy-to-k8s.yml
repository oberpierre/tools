name: Deploy to Kubernetes
on:
  workflow_call:
    inputs:
      ansible_var_file:
        description: "Path to the variable file (relative to the calling repository root) to pass to ansible. DO NOT specify secrets here."
        required: true
        type: string
      container_image:
        description: "Container image to deploy. For dynamic generation of the container image name, will be made available as CONTAINER_IMAGE environment variable and can be referenced as such in your Ansible variable file."
        required: false
        type: string
      playbook:
        description: "Playbook in tools/ansible to run. Defaults to the single-app ingress deployment."
        required: false
        type: string
        default: "k8s_deploy_app.yml"
    secrets:
      ansible_inventory_content:
        description: "Content of the Ansible inventory file to use for deployment."
        required: true
      registry_password:
        description: "Password for the container registry. May be a personal access token, GITHUB_TOKEN, or password."
        required: false
      ssh_known_hosts:
        description: "SSH known hosts content for secure connections."
        required: false
      ssh_private_key:
        description: "SSH private key for accessing the deployment target."
        required: false
      ansible_extra_vars:
        description: "JSON object of Ansible variables. Written to a file and passed as a second --extra-vars after ansible_var_file."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ inputs.ansible_var_file }}
          sparse-checkout-cone-mode: false
          path: app

      - name: Checkout tools repository
        uses: actions/checkout@v4
        with:
          repository: oberpierre/tools
          ref: v1
          sparse-checkout: |
            ansible
          path: tools

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Ansible and dependencies
        run: |
          cd tools/ansible
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          cd tools/ansible
          ansible-galaxy collection install -r galaxy_requirements.yml

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.ssh_private_key }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}

      - name: Deploy application to Kubernetes
        run: |
          cd tools/ansible
          umask 077
          printf '%s\n' "$ANSIBLE_INVENTORY_CONTENT" > inventory
          # An unset or blank ansible_inventory_content still writes a parseable,
          # empty inventory: hosts: all then matches nothing and ansible-playbook
          # exits 0 having deployed nothing. Fail before that happens.
          if ! grep -qE '^[[:space:]]*[^#[:space:]]' inventory; then
            echo "ansible_inventory_content has no non-blank, non-comment line; refusing to run against an inventory that matches no host." >&2
            exit 1
          fi
          extra_vars_args=(--extra-vars "@$ANSIBLE_VAR_FILE_PATH")
          if [ -n "$ANSIBLE_EXTRA_VARS" ]; then
            printf '%s' "$ANSIBLE_EXTRA_VARS" > extra-vars.json
            extra_vars_args+=(--extra-vars "@extra-vars.json")
          fi
          ansible-playbook "$PLAYBOOK" -i inventory "${extra_vars_args[@]}"
        env:
          CONTAINER_IMAGE: ${{ inputs.container_image }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
          ANSIBLE_EXTRA_VARS: ${{ secrets.ansible_extra_vars }}
          ANSIBLE_INVENTORY_CONTENT: ${{ secrets.ansible_inventory_content }}
          ANSIBLE_VAR_FILE_PATH: ${{ github.workspace }}/app/${{ inputs.ansible_var_file }}
          PLAYBOOK: ${{ inputs.playbook }}
