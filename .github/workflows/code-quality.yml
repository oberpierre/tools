name: CI
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*" # latest LTS version of Node.js
      - name: Installing dependencies
        run: npm ci
      - name: Checking formatting
        run: npm run format:check

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ansible-lint
        # Pinned to match ansible/requirements.txt's ansible-lint==26.8.0, so
        # CI lints with the same version as the local pre-commit gate.
        uses: ansible/ansible-lint@v26.8.0
        with:
          args: "-p *.yml"
          setup_python: "true"
          working_directory: "ansible"
          requirements_file: "galaxy_requirements.yml"
